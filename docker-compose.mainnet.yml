# CypherJester Mainnet Docker Compose
#
# Usage: docker compose -f docker-compose.mainnet.yml up -d
#
# PREREQUISITES:
# 1. VPS has >= 400GB disk, >= 16GB RAM
# 2. .env.mainnet is configured with all required variables
# 3. House wallet z-address generated and funded
# 4. Wallet backup stored off-site (encrypted)
#
# FIRST RUN:
# 1. Start Zebra and wait for its health endpoint to become ready.
# 2. Initialize Zallet encryption and create/import the wallet (DEPLOYMENT.md).
# 3. Back up wallet.db plus encryption-identity.txt immediately.
# 4. Fund the house wallet, set HOUSE_ZADDR_MAINNET in .env.mainnet.
# 5. Start the app only after Zebra and the Zallet wallet are fully synced.

services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"  # Localhost only — Nginx proxies public traffic
    env_file:
      - .env.mainnet
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/zcashino.db
      - ZCASH_RPC_URL=http://zallet:8232
      - ZCASH_WALLET_BACKEND=zallet
      - TRUST_PROXY_HEADERS=true
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    depends_on:
      zallet:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  zebra:
    # Zebra 6.0.0 is the first stable node with NU6.3/Ironwood mainnet support.
    image: zfnd/zebra@sha256:78a10b7f24b83a86e6223d97e857094a353454e3268f84a87bd987e7140a33bb
    environment:
      - ZEBRA_NETWORK__NETWORK=Mainnet
      - ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:8232
      - ZEBRA_RPC__ENABLE_COOKIE_AUTH=false
      - ZEBRA_HEALTH__LISTEN_ADDR=0.0.0.0:8080
      - ZEBRA_HEALTH__MIN_CONNECTED_PEERS=1
      - ZEBRA_HEALTH__READY_MAX_BLOCKS_BEHIND=2
    volumes:
      - zebra-mainnet-data:/home/zebra/.cache/zebra
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  zallet:
    # Zallet replaces zcashd's embedded wallet and connects to Zebra over the
    # private Compose network. The image contains both wallet backends; the
    # generated config selects the container-friendly Zaino backend.
    image: zodlinc/zallet@sha256:1849b4469875dc0165942c06d15fa6a7da76b2d43bade578cc8e5903a639869d
    user: "1000:1000"
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    command: ["-d", "/var/lib/zallet", "start"]
    configs:
      - source: zallet-mainnet-config
        target: /var/lib/zallet/zallet.toml
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - zallet-mainnet-data:/var/lib/zallet
      # The beta.1 distroless image omits its own CA bundle, but its Zaino
      # HTTP client requires one even for the private plain-HTTP Zebra RPC.
      - /etc/ssl/certs:/etc/ssl/certs:ro
    restart: unless-stopped
    depends_on:
      zebra:
        condition: service_started
      zallet-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "zallet", "-d", "/var/lib/zallet", "rpc", "getwalletstatus"]
      interval: 30s
      timeout: 20s
      start_period: 120s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  zallet-init:
    # Named volumes are root-owned on first creation; Zallet deliberately runs
    # unprivileged, so make only its data volume writable before it starts.
    image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/var/lib/zallet"]
    volumes:
      - zallet-mainnet-data:/var/lib/zallet
    restart: "no"

  migrate:
    build:
      context: .
      target: builder    # builder stage has full node_modules + Prisma CLI
    env_file:
      - .env.mainnet
    environment:
      - DATABASE_URL=file:/app/data/zcashino.db
    volumes:
      - app-data:/app/data
    command: ["node", "scripts/migrate-safe.js"]
    restart: "no"

volumes:
  app-data:
    driver: local
  zebra-mainnet-data:
    driver: local
  zallet-mainnet-data:
    driver: local

configs:
  zallet-mainnet-config:
    content: |
      backend = "zaino"

      [builder.limits]

      [consensus]
      network = "main"

      [database]

      [external]

      [features]
      as_of_version = "0.1.0-beta.1"
      legacy_pool_seed_fingerprint = "${ZALLET_LEGACY_POOL_SEED_FINGERPRINT:?ZALLET_LEGACY_POOL_SEED_FINGERPRINT is required}"

      [features.deprecated]

      [features.experimental]

      [indexer]
      validator_address = "zebra:8232"
      db_path = "zaino"

      [keystore]
      require_backup = false

      [note_management]

      [rpc]
      bind = ["0.0.0.0:8232"]
      timeout = 60

      [[rpc.auth]]
      user = "${ZCASH_RPC_USER:-zcashrpc}"
      password = "${ZCASH_RPC_PASSWORD:?ZCASH_RPC_PASSWORD is required}"

      [sync]
      recover_batch_size = 100
