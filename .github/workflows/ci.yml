name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Validate migrations on a clean database
        run: npm run db:migrations:check

      - name: Guard stale Next build lock
        run: |
          if [ -f .next/lock ]; then
            echo "::error::.next/lock exists before build. A stale lock can mask real build regressions."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          DEMO_MODE: "true"
          MULTI_BRAND_ENABLED: "true"

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e:smoke
        env:
          DEMO_MODE: "true"
          MULTI_BRAND_ENABLED: "true"
